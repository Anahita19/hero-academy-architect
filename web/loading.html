<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="manus-game-loading-screen" content="1">
  <title>Hero Academy Architect</title>
  $GODOT_HEAD_INCLUDE
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #071229; color: #eef6ff; }
    body { min-height: 100vh; display: grid; place-items: center; overflow: hidden; }
    #canvas { width: 100vw; height: 100vh; display: block; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; padding: 28px; background: radial-gradient(circle at 72% 36%, #123653 0, #071229 44%, #040b18 100%); }
    #loading::before { content: ""; position: absolute; inset: 12%; border: 1px solid #55e6d044; border-radius: 22px; box-shadow: 0 0 90px #55e6d018; pointer-events: none; }
    #loading > * { position: relative; width: min(520px, 88vw); }
    h1 { margin: 0; color: #55e6d0; font-size: clamp(28px, 5vw, 58px); letter-spacing: .06em; line-height: 1; }
    p { margin: 0; color: #91a9c6; }
    #loading-status { color: #eef6ff; }
    progress { width: min(360px, 70vw); height: 8px; accent-color: #55e6d0; }
    button { width: fit-content; min-height: 42px; padding: 0 18px; border: 1px solid #55e6d0; border-radius: 8px; background: #0b1a2d; color: #eef6ff; cursor: pointer; }
    button:focus-visible { outline: 3px solid #ffc857; outline-offset: 3px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">Your browser does not support canvas.</canvas>
  <section id="loading" role="status" aria-live="polite">
    <h1>HERO ACADEMY</h1>
    <p>ARCHITECT / TACTICS LAB</p>
    <p id="loading-status">Booting the training instance…</p>
    <progress id="loading-progress" aria-label="Download progress"></progress>
    <p id="loading-notice" hidden></p>
    <button id="loading-retry" type="button" hidden>Retry</button>
    <noscript>JavaScript is required to play this game.</noscript>
  </section>
  <script>
    (() => {
      const config = $GODOT_CONFIG;
      const threads = $GODOT_THREADS_ENABLED;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      let failed = false;
      let ready = false;
      let startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        notice.textContent = performance.now() - lastProgressAt >= 30000 ? 'No recent loading progress. You can keep waiting or retry.' : 'Still loading. You can keep waiting or retry.';
      };
      const stopObserving = () => {
        clearInterval(watch);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[hero-academy-loading] Startup failed', error);
        status.textContent = 'Unable to load the academy. Please retry.';
        progress.hidden = true;
        retry.hidden = false;
        notice.hidden = true;
      };
      const onWindowError = (event) => fail(event.error || new Error('Engine startup error'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Engine startup rejected'));
      const watch = setInterval(updateNotice, 1000);
      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);
      retry.addEventListener('click', () => window.location.reload());
      const onProgress = (current, total) => {
        if (failed || ready) return;
        if (Number.isFinite(current) && current > downloadedBytes) { downloadedBytes = current; lastProgressAt = performance.now(); }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value'); status.textContent = 'Loading academy systems…'; return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total ? 'Starting the tactics lab…' : `${Math.floor(current / total * 100)}%`;
      };
      const start = async () => {
        if (failed) return;
        try {
          startedAt = performance.now();
          lastProgressAt = startedAt;
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          requestAnimationFrame(() => requestAnimationFrame(() => { loading.hidden = true; canvas.focus(); }));
        } catch (error) { fail(error); }
      };
      const script = document.createElement('script');
      script.src = '$GODOT_URL';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
